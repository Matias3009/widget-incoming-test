name: Release APK

# Push a tag like v1.0.0 to build the app and publish a GitHub Release with the APK attached.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore from secrets."
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret: signing with a debug key."
          fi

      - name: Test and build
        env:
          VERSION_CODE: ${{ github.run_number }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export VERSION_NAME="${GITHUB_REF_NAME#v}"
          ./gradlew testDebugUnitTest assembleRelease --no-daemon
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/TestCountdown-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          name: Test Countdown ${{ github.ref_name }}
          files: dist/*.apk
          body: |
            Android home-screen widget showing time left for your tests.

            **Install:** download the APK below on your phone, open it, and allow
            "install unknown apps" for your browser/files app when asked.
            Then open the app, add your tests, and add the **Test countdown** widget
            from your home screen's widget list.

            Requires Android 8.0 or newer.
